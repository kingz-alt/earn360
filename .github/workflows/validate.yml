name: Earn360 frontend validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML entry point exists
        run: test -s index.html
      - name: Check inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(source => source.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((source, index) => {
            const file = `/tmp/earn360-inline-${index}.js`;
            fs.writeFileSync(file, source);
            execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          console.log(`Validated ${scripts.length} inline script(s).`);
          NODE
      - name: Check AI Training answer normalization
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('supabase/functions/earn360-api/index.ts', 'utf8');
          const match = source.match(/\\.normalize\\("NFD"\\)\\.replace\\((\\/\\[[^\\n]+?\\/g), ""\\)/);
          if (!match) throw new Error('AI Training normalizer pattern is missing.');
          const literal = match[1];
          const slash = literal.lastIndexOf('/');
          const accents = new RegExp(literal.slice(1, slash), literal.slice(slash + 1));
          const normalize = value => String(value ?? '').normalize('NFD').replace(accents, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
          for (const [input, expected] of [['Café', 'cafe'], ['ÉTÉ', 'ete'], ['français', 'francais'], ['à bientôt', 'a bientot']]) {
            if (normalize(input) !== expected) throw new Error('Normalization failed for: ' + input);
          }
          console.log('AI Training accent-normalization tests passed.');
          NODE
      - name: Check for private credentials in frontend
        run: |
          if grep -Eiq 'sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{30,}[.]' index.html; then
            echo "Possible private Supabase credential found in frontend."
            exit 1
          fi
